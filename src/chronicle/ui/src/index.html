<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chronicle</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">
  <script>
    // Set the theme before the first paint (ThemeService takes over once the app boots).
    try {
      var t = localStorage.getItem('ch-theme');
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <app-root>
    <!-- Shown while the app checks who is signed in, then replaced; without a session the browser leaves for Keycloak
         first, so the app never flashes. It fades in late, so a quick check shows nothing at all. -->
    <div class="preloader" role="status" aria-label="Loading Chronicle">
      <span class="preloader-mark" aria-hidden="true"></span>
    </div>
    <style>
      .preloader {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: var(--ch-canvas, #f6f7f9);
        animation: preloader-in 200ms ease-out 300ms both;
      }
      .preloader-mark {
        width: 22px; height: 22px; border-radius: 6px;
        background: var(--ch-coral, #f0524d);
        animation: preloader-pulse 1.2s ease-in-out infinite;
      }
      @keyframes preloader-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes preloader-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.82); opacity: 0.55; } }
      @media (prefers-reduced-motion: reduce) { .preloader-mark { animation: none; } }
    </style>
  </app-root>
</body>
</html>
