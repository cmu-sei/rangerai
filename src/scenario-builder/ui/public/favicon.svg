<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The top bar's mark: a rounded square split corner to corner, cobalt over violet,
       with a white "S" for Scenario Builder. The S is a stroked path, not text, so it
       doesn't depend on fonts. After changing this file, bump ?v= in src/index.html:
       browsers cache favicons past a hard refresh. -->
  <defs>
    <clipPath id="tile">
      <rect width="32" height="32" rx="9" />
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="32" height="32" fill="#7a4fd6" />
    <path d="M0 0H32L0 32Z" fill="#2f5bea" />
  </g>
  <path d="M22.4 10.6C21.4 8.6 19 7.6 16 7.6C12.2 7.6 9.8 9.5 9.8 12.1C9.8 15 12.7 15.6 16 16.2C19.5 16.8 22.4 17.6 22.4 20.3C22.4 22.9 19.9 24.6 16 24.6C12.8 24.6 10.4 23.5 9.4 21.3"
        fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
