# Grok CLI models for Amazon Bedrock (commercial AWS Regions).
#
# This fragment is concatenated into /etc/grok/managed_config.toml by
# postcreate.sh, which also emits the [models] table (default + allowed_models
# from the [model."..."] keys below) — so keep this file to [auth_provider.*]
# and [model."aws/..."] tables only, and list the preferred default first.
#
# Grok CLI has no native Bedrock (SigV4) provider; it reaches Bedrock through an
# OpenAI-compatible endpoint with a Bedrock API key as the bearer token.
# `bedrock-api-key <region>` (installed by features/grok) mints one from the
# profile's AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY on each refresh; the key is
# Region-scoped, hence one auth provider per Region.
#
# Grok 4.7 is served by Bedrock Runtime's OpenAI-compatible endpoint
# (bedrock-runtime.<region>.amazonaws.com/openai/v1, us./global. inference-profile
# ids), NOT by Mantle: both bedrock-mantle /responses and /chat/completions return
# "The model 'xai.grok-4.7' does not exist" in us-east-1, us-east-2 and us-west-2
# (verified 2026-10-23). Runtime works on both /responses and /chat/completions,
# including tool calls, so this Region matches profile.env's AWS_REGION=us-east-1.
# reasoning_summary = "none" is kept from the Mantle route; it is harmless here.

[auth_provider.bedrock-us-east-1]
command = "bedrock-api-key us-east-1"
token_ttl_secs = 1800

[model."aws/grok-4.7"]
model = "us.xai.grok-4.7"
base_url = "https://bedrock-runtime.us-east-1.amazonaws.com/openai/v1"
name = "Grok 4.7 (Bedrock US)"
description = "xAI Grok 4.7 via Amazon Bedrock Runtime (OpenAI-compatible), us-east-1"
api_backend = "responses"
reasoning_summary = "none"
auth_provider = "bedrock-us-east-1"
context_window = 500000
